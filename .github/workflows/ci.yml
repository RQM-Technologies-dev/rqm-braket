name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release policy adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --test .github/scripts/test-release-policy.cjs
      - run: python -m unittest discover -s .github/scripts -p 'test_release_*.py' -v

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install adapter wheel with released core
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(ls dist/*.whl)[dev]" "rqm-core==0.3.1"

      - name: Install released compiler stack (Python 3.11+)
        if: matrix.python-version != '3.10'
        run: pip install "rqm-compiler==0.3.8" "rqm-entanglement==0.2.3"

      - name: Check dependency compatibility
        run: pip check

      - name: Run tests
        run: pytest --tb=short --import-mode=importlib -o pythonpath=""

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so setuptools-scm can derive the version from git tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build "twine>=6.0" "packaging>=25.0"

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
