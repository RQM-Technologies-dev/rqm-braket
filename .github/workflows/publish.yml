              fail('Expected a stable vMAJOR.MINOR.PATCH tag');
            }
            if (process.env.GITHUB_REF_TYPE !== 'tag' || context.ref !== `refs/tags/${tag}`) {
              fail('Dispatch ref must be the exact requested release tag');
            }
            if (process.env.GITHUB_WORKFLOW_REF !== `${owner}/${repo}/.github/workflows/publish.yml@refs/tags/${tag}`
