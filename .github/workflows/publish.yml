                || process.env.GITHUB_WORKFLOW_SHA !== context.sha) {
              fail('Publishing workflow must come from the tagged commit');
            }
            if (!/^[0-9a-f]{40}$/.test(context.sha)) fail('Invalid workflow commit');
            const request = async (route, extra = {}) =>
              (await github.request(route, {owner, repo, ...extra})).data;
            const ref = await request('GET /repos/{owner}/{repo}/git/ref/{ref}', {ref: `tags/${tag}`});
            if (ref.ref !== `refs/tags/${tag}`) fail('Tag ref mismatch');
            let object = ref.object;
            for (let depth = 0; object?.type === 'tag' && depth < 8; depth++) {
              const annotation = await request('GET /repos/{owner}/{repo}/git/tags/{tag_sha}', {tag_sha: object.sha});
              object = annotation.object;
            }
            if (object?.type !== 'commit' || object.sha !== context.sha) {
              fail('Release tag moved or does not point to the workflow commit');
            }
