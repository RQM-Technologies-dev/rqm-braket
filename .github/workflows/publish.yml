            if (release.tag_name !== tag || release.draft !== false || release.prerelease !== false
                || !release.published_at || !Number.isSafeInteger(release.id) || release.id <= 0) {
              fail('Expected the published, non-draft stable GitHub release');
            }
            if (event === 'release' && context.payload.release?.id !== release.id) {
              fail('Published release was replaced');
            }
            if (process.env.EXPECTED_RELEASE_ID && String(release.id) !== process.env.EXPECTED_RELEASE_ID) {
              fail('Validated release was replaced');
            }
            // target_commitish is informational for existing tags; release-please uses a SHA.
            const main = await request('GET /repos/{owner}/{repo}/branches/{branch}', {branch: 'main'});
            if (main.name !== 'main' || main.protected !== true || !/^[0-9a-f]{40}$/.test(main.commit?.sha)) {
              fail('Cannot establish protected main');
            }
            const comparison = await request('GET /repos/{owner}/{repo}/compare/{basehead}', {
              basehead: `${context.sha}...${main.commit.sha}`,
            });
            if (!['ahead', 'identical'].includes(comparison.status)
                || comparison.merge_base_commit?.sha !== context.sha) {
              fail('Release commit is not in protected main history');
            }
            core.setOutput('commit', context.sha);
            core.setOutput('tag', tag);
            core.setOutput('release-id', String(release.id));

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    name: Attest release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  attach:
    name: Attach distributions to GitHub Release
    needs: [guard, build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify published release identity
        uses: actions/github-script@v8
        env:
          EXPECTED_RELEASE_ID: ${{ needs.guard.outputs.release-id }}
        with:
          script: |
            // Keep this read-only policy identical in guard, publish, and attach.
            const fail = message => { throw new Error(message); };
            const {owner, repo} = context.repo;
            if (owner !== 'RQM-Technologies-dev' || repo !== process.env.PUBLISH_PROJECT) {
              fail('Unexpected publishing repository');
            }
            const event = context.eventName;
            if (event !== 'workflow_dispatch' && event !== 'release') fail('Unsupported release event');
            if (event === 'release' && context.payload.action !== 'published') fail('Release is not published');
